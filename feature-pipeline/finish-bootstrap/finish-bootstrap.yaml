      run_id: "$config.output.run_id"
      part: "c1"
      title: "target file and target.py"
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
      checks_ok: "$c1-chk1.output.ok"
      paths_ok: "$c1-paths1.output.ok"
