name: finish-bootstrap
description: >-
  Builds the feature-pipeline core and the rebuild-finish extensions in a worktree of this
  repository (tree /home/atom/.archon/finish-bootstrap/tree on branch finish/core), one
  part at a time (red tests, then module, then checks, then commit), installs the pack,
  lands the branch on main with --ff-only and starts the finish workflow. Uses only
  Archon's own bash, script and agent nodes: it runs before the pack's .shared/ exists.
  Run from a checkout of this repository on main, launched from a copy under
  ~/.archon/workflows/feature-pipeline/finish-bootstrap/. Not for any other use.
provider: claude
model: claude-sonnet-5-5
effort: medium
worktree:
  enabled: false

nodes:
  - id: config
    bash: |
      repo=$(git rev-parse --show-toplevel) || exit 1
      jq -nc --arg repo "$repo" '{repo: $repo, tree: "/home/atom/.archon/finish-bootstrap/tree", branch: "finish/core", base: "main", records: "/home/atom/.archon/feature-run/records/bootstrap.jsonl", run_id: "bootstrap", installed: "/home/atom/.archon/workflows/feature-pipeline"}'
    mutates_checkout: false
    output_format:
      type: object
      properties: { repo: { type: string }, tree: { type: string }, branch: { type: string }, base: { type: string }, records: { type: string }, run_id: { type: string }, installed: { type: string } }
      required: [repo, tree, branch, base, records, run_id, installed]

  - id: tree
    depends_on: [config]
    script: part
    runtime: uv
    timeout: 1800000
    with:
      mode: "tree"
      tree: "$config.output.tree"
      repo: "$config.output.repo"
      branch: "$config.output.branch"
      base: "$config.output.base"
      records: "$config.output.records"
      run_id: "$config.output.run_id"
    output_format:
      type: object
      properties: { ok: {"type": "boolean"}, detail: {"type": "string"} }
      required: [ok, detail]

  - id: fault-tree
    depends_on: [tree]
    when: "$tree.output.ok == 'false'"
    cancel: "fault: the finish/core tree could not be set up. $tree.output.detail"

  - id: c1-todo
    depends_on: [tree, fault-tree]
    trigger_rule: none_failed_min_one_success
    script: part
    runtime: uv
    timeout: 1800000
    with:
      mode: "todo"
      tree: "$config.output.tree"
      repo: "$config.output.repo"
      branch: "$config.output.branch"
      base: "$config.output.base"
      records: "$config.output.records"
      run_id: "$config.output.run_id"
      part: "c1"
      title: "target file and target.py"
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
    output_format:
      type: object
      properties: { ok: {"type": "boolean"}, pending: {"type": "boolean"}, detail: {"type": "string"} }
      required: [ok, pending, detail]

  - id: c1-tw1
    depends_on: [c1-todo]
    when: "$c1-todo.output.pending == 'true'"
    command: test-writer
    provider: claude
    model: claude-sonnet-5-5
    effort: medium
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob, Edit, Write]
    with:
      tree: "$config.output.tree"
      part: "c1"
      title: "target file and target.py"
      reads: "- docs/superpowers/specs/hqptuner-archon-workflow-design.md lines 19-54\n- docs/superpowers/specs/hqptuner-archon-workflow-design.md lines 211-227"
      notes: "Build the target file and its reader exactly as the text gives them. target.load() takes an optional path; its default is the installed pack's .shared/target.toml. Tests pass explicit paths."
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
      feedback: "none"

  - id: c1-red1
    depends_on: [c1-tw1]
    script: part
    runtime: uv
    timeout: 1800000
    with:
      mode: "red"
      tree: "$config.output.tree"
      repo: "$config.output.repo"
      branch: "$config.output.branch"
      base: "$config.output.base"
      records: "$config.output.records"
      run_id: "$config.output.run_id"
      part: "c1"
      title: "target file and target.py"
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
      final: "false"
    output_format:
      type: object
      properties: { ok: {"type": "boolean"}, detail: {"type": "string"} }
      required: [ok, detail]

  - id: c1-tw2
    depends_on: [c1-red1]
    when: "$c1-red1.output.ok == 'false'"
    command: test-writer
    provider: claude
    model: claude-sonnet-5-5
    effort: medium
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob, Edit, Write]
    with:
      tree: "$config.output.tree"
      part: "c1"
      title: "target file and target.py"
      reads: "- docs/superpowers/specs/hqptuner-archon-workflow-design.md lines 19-54\n- docs/superpowers/specs/hqptuner-archon-workflow-design.md lines 211-227"
      notes: "Build the target file and its reader exactly as the text gives them. target.load() takes an optional path; its default is the installed pack's .shared/target.toml. Tests pass explicit paths."
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
      feedback: "$c1-red1.output.detail"

  - id: c1-red2
    depends_on: [c1-tw2]
    when: "$c1-red1.output.ok == 'false'"
    script: part
    runtime: uv
    timeout: 1800000
    with:
      mode: "red"
      tree: "$config.output.tree"
      repo: "$config.output.repo"
      branch: "$config.output.branch"
      base: "$config.output.base"
      records: "$config.output.records"
      run_id: "$config.output.run_id"
      part: "c1"
      title: "target file and target.py"
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
      final: "true"
    output_format:
      type: object
      properties: { ok: {"type": "boolean"}, detail: {"type": "string"} }
      required: [ok, detail]

  - id: c1-fault-red
    depends_on: [c1-red2]
    when: "$c1-red2.output.ok == 'false'"
    cancel: "fault: part c1 (target file and target.py): the test writer could not produce red tests in 2 attempts. $c1-red2.output.detail"

  - id: c1-b1
    depends_on: [c1-red1, c1-red2, c1-fault-red]
    trigger_rule: none_failed_min_one_success
    command: builder
    provider: claude
    model: claude-sonnet-5-5
    effort: medium
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob, Edit, Write]
    with:
      tree: "$config.output.tree"
      part: "c1"
      title: "target file and target.py"
      reads: "- docs/superpowers/specs/hqptuner-archon-workflow-design.md lines 19-54\n- docs/superpowers/specs/hqptuner-archon-workflow-design.md lines 211-227"
      notes: "Build the target file and its reader exactly as the text gives them. target.load() takes an optional path; its default is the installed pack's .shared/target.toml. Tests pass explicit paths."
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
      feedback: "none"

  - id: c1-chk1
    depends_on: [c1-b1]
    script: part
    runtime: uv
    timeout: 2400000
    with:
      mode: "green"
      tree: "$config.output.tree"
      repo: "$config.output.repo"
      branch: "$config.output.branch"
      base: "$config.output.base"
      records: "$config.output.records"
      run_id: "$config.output.run_id"
      part: "c1"
      title: "target file and target.py"
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
    output_format:
      type: object
      properties: { ok: {"type": "boolean"}, detail: {"type": "string"} }
      required: [ok, detail]

  - id: c1-paths1
    depends_on: [c1-chk1]
    script: part
    runtime: uv
    with:
      mode: "paths"
      tree: "$config.output.tree"
      repo: "$config.output.repo"
      branch: "$config.output.branch"
      base: "$config.output.base"
      records: "$config.output.records"
      run_id: "$config.output.run_id"
      part: "c1"
      title: "target file and target.py"
      tests: "[\"tests/test_target.py\"]"
      modules: "[\"targets/hqptuner.toml\", \"feature-pipeline/.shared/target.py\"]"
    output_format:
      type: object
      properties: { ok: {"type": "boolean"}, detail: {"type": "string"} }
