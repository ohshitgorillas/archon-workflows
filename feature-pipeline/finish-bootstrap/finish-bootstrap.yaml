      import json, os, sys, time
      sys.path.insert(0, os.path.join(os.environ["INSTALLED"], ".shared"))
      import stage
      import trees
      trees.adopt("queue", "rebuild-finish")
      r = stage.run_stage("finish", "queue", {})
      event = {"ts": time.strftime("%Y-%m-%dT%H:%M:%S%z"), "run_id": os.environ["RUN_ID"], "event": "progress",
               "step": "start", "item": "finish", "state": "green" if r.status == "completed" else "failed", "commit": None}
      with open(os.environ["RECORDS"], "a") as f:
          f.write(json.dumps(event) + "\n")
      print(json.dumps({"status": r.status, "run_id": r.run_id, "reason": r.reason or ""}))
      PY
    output_format:
      type: object
      properties: { status: {"type": "string"}, run_id: {"type": "string"}, reason: {"type": "string"} }
      required: [status, run_id, reason]

  - id: fault-start
    depends_on: [start]
    when: "$start.output.status != 'completed'"
    cancel: "fault: the finish run did not complete. $start.output.reason"

