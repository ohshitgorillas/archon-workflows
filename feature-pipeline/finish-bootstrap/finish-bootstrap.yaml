      notes: "Phase-1 functions only: RUN_ROOT, TREES with base, tests, impl and merge, cut, head, commit and remove_all. Do not build changed_paths, diff_gate, tests_digest, merge_tests or land. All git work for worktrees and commits lives in this module. The module reads RUN_ROOT and TREES at call time so tests can patch them."
      tests: "[\"tests/test_trees.py\"]"
      modules: "[\"feature-pipeline/.shared/trees.py\"]"
      feedback: "none"

  - id: c2-red1
