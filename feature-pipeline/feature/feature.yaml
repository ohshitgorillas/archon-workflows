name: feature
description: >-
  Phase 1 of the feature pipeline. Takes a request file in the target repository (the
  run's working directory) and runs a read-only planner, a prosecutor (two rounds at
  most), a plan approval gate, a spec writer, an Arbiter (two rounds at most) and a
  spec approval gate. Writes nothing. Use on a hammered-out request; not for code changes.
provider: claude
model: claude-opus-5-5
effort: medium
mutates_checkout: false
worktree:
  enabled: false

inputs:
  request:
    required: true
    description: Path of the request file, relative to the run's working directory.

nodes:
  - id: read-request
    bash: cat -- "$INPUTS_REQUEST"
    mutates_checkout: false

  - id: plan-1
    depends_on: [read-request]
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob]
    prompt: |
      You are the planner. Read the request and the repository in the working directory,
      read-only, and write a plan for the feature.

      Request:
      $read-request.output

      Give: the plan as prose; the surfaces it adds or changes (module and public name);
      the ordered steps. Plan only what the request asks. Where the request leaves a
      decision open, name it in the plan; do not guess.
    output_format:
      type: object
      properties:
        plan: { type: string }
        surfaces: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
      required: [plan, surfaces, steps]

  - id: prosecute-1
    depends_on: [plan-1]
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob]
    prompt: |
      You are the prosecutor. Attack the plan against the request and the repository,
      read-only. Check at least: every request item is covered; every named surface and
      file exists or is new on purpose; no step guesses a decision the request left open;
      nothing outside the request is added. Give each check a verdict PASS, FAIL or
      COULD_NOT_JUDGE with a reason. The overall verdict is PASS only if every check is PASS.

      Request:
      $read-request.output

      Plan:
      $plan-1.output
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [PASS, FAIL] }
        checks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              verdict: { type: string, enum: [PASS, FAIL, COULD_NOT_JUDGE] }
              reason: { type: string }
            required: [id, verdict, reason]
      required: [verdict, checks]

  - id: plan-2
    depends_on: [prosecute-1]
    when: "$prosecute-1.output.verdict != 'PASS'"
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob]
    prompt: |
      You are the planner, second round. Revise the plan so every failed or unjudged
      check is answered. Keep what passed. Read-only.

      Request:
      $read-request.output

      Previous plan:
      $plan-1.output

      Prosecutor's review:
      $prosecute-1.output
    output_format:
      type: object
      properties:
        plan: { type: string }
        surfaces: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
      required: [plan, surfaces, steps]

  - id: prosecute-2
    depends_on: [plan-2]
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob]
    prompt: |
      You are the prosecutor, second round. Attack the revised plan against the request
      and the repository, read-only, with the same checks plus whether each round-one
      failure is answered. Overall verdict PASS only if every check is PASS.

      Request:
      $read-request.output

      Revised plan:
      $plan-2.output

      Round-one review:
      $prosecute-1.output
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [PASS, FAIL] }
        checks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              verdict: { type: string, enum: [PASS, FAIL, COULD_NOT_JUDGE] }
              reason: { type: string }
            required: [id, verdict, reason]
      required: [verdict, checks]

  - id: plan-refused
    depends_on: [prosecute-2]
    when: "$prosecute-2.output.verdict != 'PASS'"
    cancel: "The plan still fails the prosecutor after two rounds. Review: $prosecute-2.output"

  - id: plan-gate
    depends_on: [prosecute-1, prosecute-2, plan-refused]
    trigger_rule: none_failed_min_one_success
    wait:
      form: approval
      attention: |
        Approve the plan?

        Plan, round 1:
        $plan-1.output

        Review, round 1:
        $prosecute-1.output

        Plan, round 2 (empty when round 1 passed):
        $plan-2.output

        Review, round 2 (empty when round 1 passed):
        $prosecute-2.output

  - id: plan-rejected
    depends_on: [plan-gate]
    when: "$plan-gate.output.decision == 'reject'"
    cancel: "Plan rejected: $plan-gate.output.text"

  - id: spec-1
    depends_on: [plan-gate, plan-rejected]
    trigger_rule: none_failed_min_one_success
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob]
    prompt: |
      You are the spec writer. Turn the approved plan into a test spec: one line per
      observable behaviour, ids S1, S2, and so on. Mark each line RED if it fails on
      today's repository and GREEN if it already holds. Read-only; describe behaviour, not
      implementation. Use the last non-empty plan below; the round-2 plan, when present,
      is the approved one.

      Request:
      $read-request.output

      Plan, round 1:
      $plan-1.output

      Plan, round 2 (empty when round 1 passed):
      $plan-2.output

      Owner's note on approval:
      $plan-gate.output.text
    output_format:
      type: object
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              behaviour: { type: string }
              start: { type: string, enum: [RED, GREEN] }
            required: [id, behaviour, start]
      required: [lines]

  - id: arbiter-1
    depends_on: [spec-1]
    context: fresh
    allowed_tools: []
    prompt: |
      You are the Arbiter. You see only the request and the test spec. Rule on each spec
      line: ACCEPT if it follows from the request and tests an observable behaviour,
      REJECT if it asks for more or less than the request, or is not observable. Overall
      verdict ACCEPT only if every line is ACCEPT.

      Request:
      $read-request.output

      Spec:
      $spec-1.output
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [ACCEPT, REJECT] }
        rulings:
          type: array
          items:
            type: object
            properties:
              line: { type: string }
              verdict: { type: string, enum: [ACCEPT, REJECT] }
              reason: { type: string }
            required: [line, verdict, reason]
      required: [verdict, rulings]

  - id: spec-2
    depends_on: [arbiter-1]
    when: "$arbiter-1.output.verdict != 'ACCEPT'"
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob]
    prompt: |
      You are the spec writer, second round. Rewrite the spec so every rejected line is
      fixed. Keep accepted lines as they are. Read-only.

      Request:
      $read-request.output

      Spec:
      $spec-1.output

      Arbiter's rulings:
      $arbiter-1.output
    output_format:
      type: object
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              behaviour: { type: string }
              start: { type: string, enum: [RED, GREEN] }
            required: [id, behaviour, start]
      required: [lines]

  - id: arbiter-2
    depends_on: [spec-2]
    context: fresh
    allowed_tools: []
    prompt: |
      You are the Arbiter, second round. You see only the request and the revised test
      spec. Rule on each line as before. Overall verdict ACCEPT only if every line is ACCEPT.

      Request:
      $read-request.output

      Spec:
      $spec-2.output
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [ACCEPT, REJECT] }
        rulings:
          type: array
          items:
            type: object
            properties:
              line: { type: string }
              verdict: { type: string, enum: [ACCEPT, REJECT] }
              reason: { type: string }
            required: [line, verdict, reason]
      required: [verdict, rulings]

  - id: spec-refused
    depends_on: [arbiter-2]
    when: "$arbiter-2.output.verdict != 'ACCEPT'"
    cancel: "The Arbiter still rejects the spec after two rounds. Rulings: $arbiter-2.output"

  - id: spec-gate
    depends_on: [arbiter-1, arbiter-2, spec-refused]
    trigger_rule: none_failed_min_one_success
    wait:
      form: approval
      attention: |
        Approve the spec?

        Spec, round 1:
        $spec-1.output

        Rulings, round 1:
        $arbiter-1.output

        Spec, round 2 (empty when round 1 was accepted):
        $spec-2.output

        Rulings, round 2 (empty when round 1 was accepted):
        $arbiter-2.output

  - id: spec-rejected
    depends_on: [spec-gate]
    when: "$spec-gate.output.decision == 'reject'"
    cancel: "Spec rejected: $spec-gate.output.text"
