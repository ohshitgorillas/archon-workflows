name: plan-review
description: >-
  Building block, include only; not for a standalone run. One planning stage before any
  build. First recall looks up the plan record for this design and scope, on any commit: a
  record another run wrote, that passed review, that the owner has not rejected, and none
  of whose Plan or Spec paths changed since the commit it was written on, is reused as it
  stands, and no round or agent runs. Otherwise, strictly in order and starting from the
  recalled record when there is one: the planner cuts the code steps from the Detective's
  file:line answers, a citation resolver checks and corrects any cite, a check probe reads
  every step's check against the run's checkout root and branch without running it, and the
  prosecutor rules on the Plan; only when no prosecutor finding is blocking and no
  probe finding stands does the specifier write the test spec against that
  approved Plan, measuring through the Examiner on a throwaway copy, and the arbiter rule on
  the Spec. A blocking arbiter finding against the Plan reopens it; minor findings never
  route. Attempts are judged on their findings, never by a counter: the planner or the
  specifier gets another attempt while the blocking findings include only ones no earlier
  attempt in this review was given; a blocking finding that comes back after an attempt
  addressed it, with the same cause and basis or the same target and field, makes the call return
  refused at once and finish cancels with the blocking findings. A resumed call carries the
  findings already addressed by the call it resumes. A blocking decision (one a
  Plan or Spec step lists in blocked_by) stops the round as soon as its author writes it,
  before the prosecutor or arbiter runs: the call returns verdict blocked with the question
  for its caller to ask the owner, and a later call given resume (that call's stopped field) and
  answer (the owner's reply) starts again from where it stopped with the answer designed in.
  Returns the Plan and Spec, a verdict of pass, refused or blocked, the findings, every
  decision of the Plan and Spec, the blocking questions, whether it was recalled, the owner's
  approval and the record key; keep then writes that result to the plan record.
provider: claude
model: claude-opus-5-5
effort: medium

inputs:
  design:
    required: true
    description: Path of the design being built, in the run's checkout, or at design_ref when absent there.
  scope:
    required: true
    description: Design steps still to build; each is a unit key.
  survey:
    required: true
    description: Tail of the latest full-check output.
  carry:
    required: true
    description: >-
      Prior cycle: last plan and spec, open steps, design gaps, stuck steps, stray edits,
      owner answers, last findings and refusal findings.
  design_ref:
    default: ""
    description: >-
      Ref to read the design from when its path is absent from the run's checkout; empty
      reads the checkout only.
  land_branch:
    default: ""
    description: Branch the caller merges in each cycle and lands on afterwards; empty when it does not land.
  land_checkout:
    default: ""
    description: Checkout holding land_branch; empty when the caller does not land.
  resume:
    default: ""
    description: >-
      The stopped field of an earlier call that returned verdict blocked; this call starts
      again from where that call stopped. Empty or null starts as usual.
  answer:
    default: ""
    description: The owner's answer to the blocked call's question; empty when there is none.

returns: verdict

nodes:
  - id: recall
    mutates_checkout: false
    bash: |
      set -euo pipefail
      design=$INPUTS_DESIGN
      scope=$INPUTS_SCOPE
      ref=$INPUTS_DESIGN_REF
      read=$design
      from="the run's checkout"
      if [ -f "$design" ]; then
        blob=$(git hash-object -- "$design")
      elif [ -n "$ref" ] && git cat-file -e "$ref:$design" 2>/dev/null; then
        mkdir -p "$ARTIFACTS_DIR/design-ref"
        read="$ARTIFACTS_DIR/design-ref/$(basename -- "$design")"
        git show "$ref:$design" > "$read"
        blob=$(git rev-parse "$ref:$design")
        from="ref $ref: $design is absent from the run's checkout, so it was copied out of that ref"
      else
        blob=absent
        from="neither the run's checkout nor a ref: read it as given"
      fi
      root=$(git rev-parse --show-toplevel)
      branch=$(git symbolic-ref --short -q HEAD || echo "detached HEAD")
      head=$(git rev-parse HEAD)
      key=$(jq -cn --arg design "$design" --arg design_blob "$blob" --arg scope "$scope" \
        '{design: $design, design_blob: $design_blob, scope: $scope}' | sha256sum | cut -d ' ' -f 1)
      file="$STATE_DIR/feature-pipeline/plans/$key.json"
      record=null
      moved='[]'
      if [ -f "$file" ]; then
        record=$(cat "$file")
        rhead=$(jq -r '.head // ""' "$file")
        if [ "$rhead" != "$head" ]; then
          named=$(jq -r '[.plan.steps[]?.paths[]?, .plan.steps[]?.cites[]?.path, .spec.lines[]?.file,
            .spec.steps[]?.paths[]?, .spec.helpers[]?.path] | map(select(type == "string" and . != "")) | unique[]' "$file")
          changed=""
          if [ -z "$rhead" ] || ! changed=$(git diff --no-renames --name-only "$rhead" HEAD 2>/dev/null); then
            changed=$named
          fi
          moved=$(jq -cn --rawfile n <(printf '%s' "$named") --rawfile c <(printf '%s' "$changed") '
            ($c | split("\n") | map(select(. != ""))) as $c
            | [$n | split("\n")[] | select(. != "") | . as $p
               | select(any($c[]; . == $p or startswith($p + "/")))]')
        fi
      fi
      resume=$INPUTS_RESUME
      answer=$INPUTS_ANSWER
      stopped=null
      if [ -n "$resume" ] && [ "$resume" != null ]; then
        if ! printf '%s' "$resume" | jq -e 'type == "object" and .next == "blocked" and (.resume == "plan" or .resume == "spec")' > /dev/null 2>&1; then
          echo "recall: resume is not the stopped field of a plan-review call that returned verdict blocked" >&2
          exit 1
        fi
        stopped=$resume
      fi
      jq -cn --arg key "$key" --arg design "$design" --arg design_blob "$blob" --arg scope "$scope" --arg head "$head" \
        --arg run "$WORKFLOW_ID" --slurpfile record <(printf '%s' "$record") --slurpfile stopped <(printf '%s' "$stopped") --arg answer "$answer" \
        --slurpfile moved <(printf '%s' "$moved") \
        --arg read "$read" --arg from "$from" --arg root "$root" --arg branch "$branch" '
        def one($n): if length == 1 then .[0] else error("recall: \($n) is not one JSON value") end;
        ($record | one("record")) as $record | ($stopped | one("stopped")) as $stopped | ($moved | one("moved")) as $moved |
        (if $answer == "" then []
         else [{decisions: (($stopped // {}).questions // []), text: $answer}] end) as $given
        | ((($stopped // {}).answers // []) + (($record // {}).answers // []) + $given
           | reduce .[] as $a ([]; if any(.[]; . == $a) then . else . + [$a] end)) as $answers
        | {
          key: $key,
          design: $design,
          design_blob: $design_blob,
          scope: $scope,
          head: $head,
          moved: $moved,
          read: $read,
          from: $from,
          root: $root,
          branch: $branch,
          next: (if $stopped == null
                    and $record != null
                    and $record.verdict == "pass"
                    and $record.approval.state != "rejected"
                    and $record.run != $run
                    and $moved == []
                 then "reuse" else "rounds" end),
          start: (if $stopped == null then "plan" else $stopped.resume end),
          seed: $stopped,
          answers: $answers,
          record: $record
        }'
    output_format:
      type: object
      properties:
        key: { type: string, pattern: '^[0-9a-f]{64}$' }
        design: { type: string }
        design_blob: { type: string }
        scope: { type: string }
        head: { type: string }
        moved: { type: array, items: { type: string } }
        read: { type: string }
        from: { type: string }
        root: { type: string }
        branch: { type: string }
        next: { type: string, enum: [rounds, reuse] }
        start: { type: string, enum: [plan, spec] }
        seed: { type: [object, 'null'] }
        answers:
          type: array
          items:
            type: object
            properties:
              decisions: { type: array, items: { type: object } }
              text: { type: string }
            required: [decisions, text]
        record: { type: [object, 'null'] }
      required: [key, design, design_blob, scope, head, moved, read, from, root, branch, next, start, seed, answers, record]

  - id: track
    command: track
    depends_on: [recall]
    when: "$recall.output.next == 'rounds'"
    context: fresh
    mutates_checkout: false
    allowed_tools: [Read, Grep, Glob]
    output_format:
      type: object
      properties:
        track: { type: string, enum: [full, tests-only, test-free] }
      required: [track]

  - id: rounds
    depends_on: [recall, track]
    when: "$recall.output.next == 'rounds'"
    loop_group:
      max_iterations: 24
      until_bash: |
        n=$round.output.next
        [ "$n" = done ] || [ "$n" = refused ] || [ "$n" = blocked ]
      nodes:
        - id: plan
          command: plan
          when: "$track.output.track != 'tests-only' && $LOOP_PREV.round.output.next == 'plan' || $track.output.track != 'tests-only' && $LOOP_PREV.round.output.next != 'spec' && $recall.output.start == 'plan'"
          context: fresh
          mutates_checkout: false
          allowed_tools: [Agent]
          agents:
            detective:
              description: Answers the planner's questions from the checkout as a path:line Table
              prompt: |
                You are the Detective, a reader. The planner hands you its questions all at
                once. Answer each one from the checkout and return one Table.

                - Read, Grep and Glob are your only tools. You write nothing and run nothing.
                - Every answer carries at least one cite. A cite is an object with path (the
                  repository-relative file), line (1-based) and quote (that line's text,
                  copied verbatim). Never cite a line you have not read.
                - Never re-check or argue a line number; a resolver downstream checks every
                  cite against its quote.
                - A question you cannot answer from the tree gets status unresolved, with the
                  reason in answer, and the closest cite you found. Never guess.

                Return JSON only, in this shape:
                {"rows": [{"question": "...", "answer": "...",
                           "cites": [{"path": "...", "line": 1, "quote": "..."}],
                           "status": "answered" or "unresolved"}]}
              tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              steps:
                type: array
                maxItems: 20
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^c[0-9]+$' }
                    unit: { type: string }
                    paths:
                      type: array
                      minItems: 1
                      items: { type: string }
                    check: { type: string }
                    blocked_by:
                      type: array
                      items: { type: string, pattern: '^[cd][0-9]+$' }
                    cites:
                      type: array
                      items:
                        type: object
                        properties:
                          path: { type: string }
                          line: { type: integer, minimum: 1 }
                          quote: { type: string, minLength: 1 }
                        required: [path, line, quote]
                  required: [id, unit, paths, check, blocked_by]
              landed:
                type: array
                items: { type: string }
              decisions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^d[0-9]+$' }
                    question: { type: string }
                    recommend: { type: string }
                    alternative: { type: string }
                    cost: { type: string }
                  required: [id, question, recommend, alternative, cost]
            required: [steps, decisions]

        - id: cite
          script: cite
          runtime: uv
          depends_on: [plan, hold]
          when: "$hold.output.stop == false"
          mutates_checkout: false
          timeout: 60000
          with:
            plan: $plan.output
          output_format:
            type: object
            properties:
              plan: { type: object }
              unresolved:
                type: array
                items:
                  type: object
                  properties:
                    step: { type: string }
                    path: { type: string }
                    line: { type: integer }
                    quote: { type: string }
                    reason: { type: string }
                  required: [step, path, line, quote, reason]
            required: [plan, unresolved]

        - id: probe
          script: probe
          runtime: uv
          depends_on: [plan, hold]
          when: "$hold.output.stop == false"
          mutates_checkout: false
          timeout: 60000
          with:
            plan: $plan.output
            root: $recall.output.root
            branch: $recall.output.branch
          output_format:
            type: object
            properties:
              findings:
                type: array
                items:
                  type: object
                  properties:
                    author: { type: string, enum: [plan] }
                    target: { type: string }
                    field: { type: string, enum: [check] }
                    cause: { type: string }
                    basis: { type: string, minLength: 1 }
                    severity: { type: string, enum: [blocking] }
                    design_it_in: { type: boolean }
                  required: [author, target, field, cause, basis, severity, design_it_in]
            required: [findings]

        - id: prosecute
          command: prosecute
          depends_on: [cite, probe, hold]
          when: "$hold.output.stop == false"
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              verdict: { type: string, enum: [pass, fail] }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    author: { type: string, enum: [plan, spec] }
                    target: { type: string }
                    field: { type: string, enum: [unit, paths, check, order, blocked_by, cites, step, before, file, shared, setup, assertion, whole] }
                    cause: { type: string }
                    basis: { type: string, minLength: 1 }
                    severity: { type: string, enum: [blocking, minor] }
                    design_it_in: { type: boolean }
                  required: [author, target, field, cause, basis, severity, design_it_in]
            required: [verdict, findings]

        - id: spec
          command: spec
          when: "$track.output.track == 'tests-only' || $track.output.track == 'full' && $LOOP_PREV.round.output.next == 'spec' || $track.output.track == 'full' && $LOOP_PREV.round.output.next != 'plan' && $recall.output.start == 'spec'"
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob, Agent]
          sandbox:
            enabled: true
            network:
              allowedDomains: []
              allowManagedDomainsOnly: true
          agents:
            examiner:
              description: Measures behavior with a script on a throwaway copy of the checkout
              prompt: |
                You are the Examiner. The specifier hands you one measurement (the behavior a
                Spec line's assertion pins) and a scratch directory. Measure it and return
                the result.

                - Copy the checkout's tracked and unignored untracked files (the list from
                  git ls-files -co --exclude-standard) into a fresh directory under the
                  scratch directory, and work only in that copy. Never write to the checkout.
                - Run every command under timeout and nice, with at most half of nproc jobs.
                  You have no network.
                - Write the smallest script that measures the behavior, run it, and keep its
                  output.
                - A measurement you cannot make gets status unresolved, with the reason in
                  value. Never guess a value.

                Return JSON only, in this shape:
                {"question": "...", "value": "...", "script": "...", "output": "...",
                 "status": "measured" or "unresolved"}
              tools: [Read, Grep, Glob, Bash, Write, Edit]
          output_format:
            type: object
            properties:
              lines:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^t[0-9]+$' }
                    step: { type: [string, 'null'] }
                    claim: { type: string }
                    mark: { type: string, enum: [RED, GREEN] }
                    preserves: { type: [string, 'null'] }
                    file: { type: string }
                    shared:
                      type: array
                      items: { type: string }
                    setup: { type: [string, 'null'] }
                    assertion: { type: [string, 'null'] }
                  required: [id, step, claim, mark, preserves, file, shared, setup, assertion]
              helpers:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^h[0-9]+$' }
                    path: { type: string }
                    provides: { type: string }
                  required: [id, path, provides]
              steps:
                type: array
                maxItems: 20
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^w[0-9]+$' }
                    before: { type: [string, 'null'] }
                    lines:
                      type: array
                      minItems: 1
                      items: { type: string }
                    paths:
                      type: array
                      items: { type: string }
                    check: { type: string }
                    blocked_by:
                      type: array
                      items: { type: string, pattern: '^[cdw][0-9]+$' }
                  required: [id, before, lines, paths, check, blocked_by]
              decisions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^d[0-9]+$' }
                    question: { type: string }
                    recommend: { type: string }
                    alternative: { type: string }
                    cost: { type: string }
                  required: [id, question, recommend, alternative, cost]
            required: [lines, helpers, steps, decisions]

        - id: hold
          depends_on: [plan, spec]
          trigger_rule: all_done
          mutates_checkout: false
          bash: |
            set -euo pipefail
            plan=$plan.output
            spec=$spec.output
            prev=$LOOP_PREV.round.output
            found=$recall.output
            [ -n "$plan" ] || plan=null
            [ -n "$spec" ] || spec=null
            [ -n "$prev" ] || prev=null
            jq -nc --slurpfile planned <(printf '%s' "$plan") --slurpfile written <(printf '%s' "$spec") --slurpfile last <(printf '%s' "$prev") --slurpfile found <(printf '%s' "$found") '
              def one($n): if length == 1 then .[0] else error("hold: \($n) is not one JSON value") end;
              ($planned | one("planned")) as $planned | ($written | one("written")) as $written | ($last | one("last")) as $last | ($found | one("found")) as $found |
              (if $planned != null then "plan"
               elif $written != null then "spec"
               else error("hold: neither the planner nor the specifier answered this round") end) as $at
              | (if $at == "plan" then $planned else (($last // $found.seed // {}).plan // {}) end) as $p
              | (if $at == "spec" then $written else {} end) as $s
              | [($p.steps // [])[], ($s.steps // [])[] | .blocked_by[] | select(startswith("d"))] as $ids
              | ([($p.decisions // [])[], ($s.decisions // [])[]]
                 | map(select(.id | IN($ids[])))
                 | unique_by(.id)) as $asked
              | {at: $at, stop: ($asked | length > 0), questions: $asked}'
          output_format:
            type: object
            properties:
              at: { type: string, enum: [plan, spec] }
              stop: { type: boolean }
              questions: { type: array, items: { type: object } }
            required: [at, stop, questions]

        - id: arbitrate
          command: arbitrate
          depends_on: [spec, hold]
          when: "$hold.output.stop == false"
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              verdict: { type: string, enum: [pass, fail] }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    author: { type: string, enum: [plan, spec] }
                    target: { type: string }
                    field: { type: string, enum: [unit, paths, check, order, blocked_by, cites, step, before, file, shared, setup, assertion, whole] }
                    cause: { type: string }
                    basis: { type: string, minLength: 1 }
                    severity: { type: string, enum: [blocking, minor] }
                    design_it_in: { type: boolean }
                  required: [author, target, field, cause, basis, severity, design_it_in]
            required: [verdict, findings]

        - id: round
          depends_on: [hold, prosecute, arbitrate]
          trigger_rule: all_done
          mutates_checkout: false
          bash: |
            held=$hold.output
            plan=$plan.output
            cite=$cite.output
            probe=$probe.output
            prosecute=$prosecute.output
            spec=$spec.output
            arbitrate=$arbitrate.output
            track=$track.output.track
            prev=$LOOP_PREV.round.output
            found=$recall.output
            [ -n "$plan" ] || plan=null
            [ -n "$cite" ] || cite=null
            [ -n "$probe" ] || probe=null
            [ -n "$prosecute" ] || prosecute=null
            [ -n "$spec" ] || spec=null
            [ -n "$arbitrate" ] || arbitrate=null
            [ -n "$prev" ] || prev=null
            jq -nc --slurpfile held <(printf '%s' "$held") --slurpfile planned <(printf '%s' "$plan") --slurpfile resolved <(printf '%s' "$cite") --slurpfile probed <(printf '%s' "$probe") --slurpfile ruling <(printf '%s' "$prosecute") --slurpfile written <(printf '%s' "$spec") --slurpfile arbiter <(printf '%s' "$arbitrate") --slurpfile last <(printf '%s' "$prev") --slurpfile found <(printf '%s' "$found") --arg track "$track" '
              def one($n): if length == 1 then .[0] else error("round: \($n) is not one JSON value") end;
              ($held | one("held")) as $held | ($planned | one("planned")) as $planned | ($resolved | one("resolved")) as $resolved | ($probed | one("probed")) as $probed | ($ruling | one("ruling")) as $ruling | ($written | one("written")) as $written | ($arbiter | one("arbiter")) as $arbiter | ($last | one("last")) as $last | ($found | one("found")) as $found |
              {steps: [], decisions: []} as $noplan
              | {lines: [], helpers: [], steps: [], decisions: []} as $nospec
              | ($last // $found.seed // {}) as $p
              | ($p.addressed // []) as $given
              | if $held.stop then
                  {
                    next: "blocked",
                    addressed: $given,
                    fresh: [],
                    plan: (if $held.at == "plan" then $planned else ($p.plan // $noplan) end),
                    spec: (if $held.at == "spec" then $written else ($p.spec // null) end),
                    findings: ($p.findings // []),
                    questions: $held.questions,
                    resume: $held.at
                  }
                elif $held.at == "plan" then
                  ($resolved.unresolved | map({
                    author: "plan",
                    target: .step,
                    field: "cites",
                    cause: "\(.path):\(.line): \(.reason)",
                    basis: "the cite quotes `\(.quote)`, and no single line of \(.path) is that text",
                    severity: "minor",
                    design_it_in: false
                  })) as $uncited
                  | (($probed // {}).findings // []) as $checks
                  | ($ruling.findings + $uncited + $checks) as $filed
                  | {
                      next: (if any($filed[]; .severity == "blocking") then "plan"
                             elif $track == "test-free" then "done"
                             else "spec" end),
                      addressed: $given,
                      fresh: [$filed[] | select(.severity == "blocking")],
                      plan: $resolved.plan,
                      spec: (if $track == "test-free" then $nospec else ($p.spec // null) end),
                      findings: ($filed + (($p.findings // []) | map(select(.author == "spec")))),
                      questions: [],
                      resume: null
                    }
                else
                  {
                    next: (if any($arbiter.findings[]; .severity == "blocking" and .author == "plan") then (if $track == "tests-only" then "spec" else "plan" end)
                           elif any($arbiter.findings[]; .severity == "blocking") then "spec"
                           else "done" end),
                    addressed: $given,
                    fresh: [$arbiter.findings[] | select(.severity == "blocking")],
                    plan: ($p.plan // $noplan),
                    spec: $written,
                    findings: ($arbiter.findings + (($p.findings // []) | map(select(.author == "plan" and .severity == "minor")))),
                    questions: [],
                    resume: null
                  }
                end
              | .fresh as $now
              | ([$now[] as $f | $given[] | select((.cause == $f.cause and .basis == $f.basis) or (.target == $f.target and .field == $f.field))] | length > 0) as $back
              | if $back then .next = "refused"
                elif .next == "plan" or .next == "spec" then .addressed = ($given + $now)
                else . end
              | del(.fresh)'
          output_format:
            type: object
            properties:
              next: { type: string, enum: [plan, spec, done, refused, blocked] }
              addressed:
                type: array
                items:
                  type: object
                  properties:
                    author: { type: string }
                    target: { type: string }
                    field: { type: string }
                    cause: { type: string }
                    basis: { type: string }
                  required: [target, field, cause, basis]
              plan: { type: object }
              spec: { type: [object, 'null'] }
              findings: { type: array, items: { type: object } }
              questions: { type: array, items: { type: object } }
              resume: { type: [string, 'null'], enum: [plan, spec, null] }
            required: [next, addressed, plan, spec, findings, questions, resume]

  - id: verdict
    runtime: uv
    depends_on: [recall, rounds]
    trigger_rule: all_done
    mutates_checkout: false
    timeout: 60000
    with:
      recall: $recall.output
      round: { from: $rounds.output, if_skipped: null }
    script: |
      import json
      import os
      import sys


      def gathered(plan: dict, spec: dict) -> list:
          seen = set()
          kept = []
          for decision in list(plan.get("decisions") or []) + list(spec.get("decisions") or []):
              if decision["id"] in seen:
                  continue
              seen.add(decision["id"])
              kept.append(decision)
          return kept


      def asked(questions: list) -> str:
          return "\n".join(
              "Decision %s: %s Recommend: %s. Alternative: %s. Cost: %s."
              % (d["id"], d["question"], d["recommend"], d["alternative"], d["cost"])
              for d in questions
          )


      def main() -> int:
          recall = json.loads(os.environ["INPUTS_RECALL"])
          last = json.loads(os.environ["INPUTS_ROUND"])
          if last is None and recall["next"] == "reuse":
              record = recall["record"]
              result = {
                  "verdict": record["verdict"],
                  "recalled": True,
                  "findings": record["findings"],
                  "decisions": record["decisions"],
                  "approval": record["approval"],
                  "key": recall["key"],
                  "plan": record["plan"],
                  "spec": record["spec"],
                  "questions": [],
                  "question": "",
                  "stopped": None,
              }
          elif last is not None and recall["next"] == "rounds":
              spec = last["spec"] if last["spec"] is not None else {}
              blocked = last["next"] == "blocked"
              if blocked:
                  verdict = "blocked"
              elif last["next"] == "done":
                  verdict = "pass"
              else:
                  verdict = "refused"
              result = {
                  "verdict": verdict,
                  "recalled": False,
                  "findings": last["findings"],
                  "decisions": gathered(last["plan"], spec),
                  "approval": {"state": "none", "text": ""},
                  "key": recall["key"],
                  "plan": last["plan"],
                  "spec": spec,
                  "questions": last["questions"],
                  "question": asked(last["questions"]),
                  "stopped": dict(last, answers=recall["answers"]) if blocked else None,
              }
          else:
              print(
                  "verdict: recall.next is %r but the last round is %s"
                  % (recall["next"], "missing" if last is None else "present"),
                  file=sys.stderr,
              )
              return 1
          print(json.dumps(result, separators=(",", ":")))
          return 0


      sys.exit(main())
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [pass, refused, blocked] }
        plan: { type: object }
        spec: { type: object }
        findings: { type: array, items: { type: object } }
        decisions: { type: array, items: { type: object } }
        questions: { type: array, items: { type: object } }
        question: { type: string }
        stopped: { type: [object, 'null'] }
        recalled: { type: boolean }
        approval:
          type: object
          properties:
            state: { type: string, enum: [approved, rejected, none] }
            text: { type: string }
          required: [state, text]
        key: { type: string }
      required: [verdict, plan, spec, findings, decisions, questions, question, stopped, recalled, approval, key]

  - id: keep
    depends_on: [verdict]
    mutates_checkout: false
    bash: |
      set -euo pipefail
      found=$recall.output
      answer=$verdict.output
      key=$recall.output.key
      carry=$INPUTS_CARRY
      dir="$STATE_DIR/feature-pipeline/plans"
      mkdir -p "$dir"
      jq -n --slurpfile found <(printf '%s' "$found") --slurpfile answer <(printf '%s' "$answer") --arg run "$WORKFLOW_ID" --arg carry "$carry" '
        def one($n): if length == 1 then .[0] else error("keep: \($n) is not one JSON value") end;
        ($found | one("found")) as $found | ($answer | one("answer")) as $answer |
        {
          key: $found.key,
          design: $found.design,
          design_blob: $found.design_blob,
          scope: $found.scope,
          head: $found.head,
          run: $run,
          carry: ((($found.record // {}).carry // []) + [$carry]),
          verdict: $answer.verdict,
          plan: $answer.plan,
          spec: $answer.spec,
          findings: $answer.findings,
          decisions: $answer.decisions,
          approval: $answer.approval,
          answers: $found.answers
        }' > "$dir/$key.json.tmp"
      mv "$dir/$key.json.tmp" "$dir/$key.json"
