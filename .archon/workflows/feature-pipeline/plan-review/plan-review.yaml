name: plan-review
description: >-
  Building block, include only; not for a standalone run. One planning stage before any
  build. First recall looks up the plan record for this design, scope and commit: a record
  another run wrote, that passed review and that the owner has not rejected, is reused as
  it stands, and no round or agent runs. Otherwise, strictly in order and starting from the
  recalled record when there is one: the planner cuts the code steps from the Detective's
  file:line answers, a citation resolver checks and corrects every cite, and the prosecutor
  rules on the Plan; only on a pass does the specifier write the test spec against that
  approved Plan, measuring through the Examiner on a throwaway copy, and the arbiter rule on
  the Spec. An arbiter finding against the Plan reopens it. At most 4 Plan attempts and 4
  Spec attempts per call. Returns the Plan and Spec, a verdict of pass or refused, the
  findings, the decisions that survived review, whether it was recalled, the owner's
  approval and the record key; keep then writes that result to the plan record.
provider: claude
model: claude-opus-5-5
effort: medium

inputs:
  design:
    required: true
    description: Path of the design being built, in the run's checkout.
  scope:
    required: true
    description: Design steps still to build; each is a unit key.
  survey:
    required: true
    description: Tail of the latest full-check output.
  carry:
    required: true
    description: >-
      Prior cycle: last plan and spec, open steps, design gaps, stuck steps, stray edits,
      owner answers, last findings and refusal findings.

returns: verdict

nodes:
  - id: recall
    mutates_checkout: false
    bash: |
      set -euo pipefail
      design=$INPUTS_DESIGN
      scope=$INPUTS_SCOPE
      if [ -f "$design" ]; then
        blob=$(git hash-object -- "$design")
      else
        blob=absent
      fi
      head=$(git rev-parse HEAD)
      key=$(jq -cn --arg design "$design" --arg design_blob "$blob" --arg scope "$scope" --arg head "$head" \
        '{design: $design, design_blob: $design_blob, scope: $scope, head: $head}' | sha256sum | cut -d ' ' -f 1)
      file="$STATE_DIR/feature-pipeline/plans/$key.json"
      record=null
      if [ -f "$file" ]; then
        record=$(cat "$file")
      fi
      jq -cn --arg key "$key" --arg design "$design" --arg design_blob "$blob" --arg scope "$scope" --arg head "$head" \
        --arg run "$WORKFLOW_ID" --argjson record "$record" '
        {
          key: $key,
          design: $design,
          design_blob: $design_blob,
          scope: $scope,
          head: $head,
          next: (if $record != null
                    and $record.verdict == "pass"
                    and $record.approval.state != "rejected"
                    and $record.run != $run
                 then "reuse" else "rounds" end),
          record: $record
        }'
    output_format:
      type: object
      properties:
        key: { type: string, pattern: '^[0-9a-f]{64}$' }
        design: { type: string }
        design_blob: { type: string }
        scope: { type: string }
        head: { type: string }
        next: { type: string, enum: [rounds, reuse] }
        record: { type: [object, 'null'] }
      required: [key, design, design_blob, scope, head, next, record]

  - id: rounds
    depends_on: [recall]
    when: "$recall.output.next == 'rounds'"
    loop_group:
      max_iterations: 8
      until_bash: |
        n=$round.output.next
        [ "$n" = done ] || [ "$n" = refused ]
      nodes:
        - id: plan
          command: plan
          when: "$LOOP_PREV.round.output.next != 'spec'"
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob, Agent]
          agents:
            detective:
              description: Answers the planner's questions from the checkout as a path:line Table
              prompt: |
                You are the Detective, a reader. The planner hands you its questions all at
                once. Answer each one from the checkout and return one Table.

                - Read, Grep and Glob are your only tools. You write nothing and run nothing.
                - Every answer carries at least one cite. A cite is an object with path (the
                  repository-relative file), line (1-based) and quote (that line's text,
                  copied verbatim). Never cite a line you have not read.
                - Never re-check or argue a line number; a resolver downstream checks every
                  cite against its quote.
                - A question you cannot answer from the tree gets status unresolved, with the
                  reason in answer, and the closest cite you found. Never guess.

                Return JSON only, in this shape:
                {"rows": [{"question": "...", "answer": "...",
                           "cites": [{"path": "...", "line": 1, "quote": "..."}],
                           "status": "answered" or "unresolved"}]}
              tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              steps:
                type: array
                minItems: 1
                maxItems: 20
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^c[0-9]+$' }
                    unit: { type: string }
                    kind: { type: string, enum: [code, merge] }
                    paths:
                      type: array
                      minItems: 1
                      items: { type: string }
                    check: { type: string }
                    blocked_by:
                      type: array
                      items: { type: string }
                    cites:
                      type: array
                      items:
                        type: object
                        properties:
                          path: { type: string }
                          line: { type: integer, minimum: 1 }
                          quote: { type: string, minLength: 1 }
                        required: [path, line, quote]
                  required: [id, unit, kind, paths, check, blocked_by]
              decisions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^d[0-9]+$' }
                    question: { type: string }
                    recommend: { type: string }
                    alternative: { type: string }
                    cost: { type: string }
                  required: [id, question, recommend, alternative, cost]
            required: [steps, decisions]

        - id: cite
          script: cite
          runtime: uv
          depends_on: [plan]
          mutates_checkout: false
          timeout: 60000
          with:
            plan: $plan.output
          output_format:
            type: object
            properties:
              plan: { type: object }
              unresolved:
                type: array
                items:
                  type: object
                  properties:
                    step: { type: string }
                    path: { type: string }
                    line: { type: integer }
                    quote: { type: string }
                    reason: { type: string }
                  required: [step, path, line, quote, reason]
            required: [plan, unresolved]

        - id: prosecute
          command: prosecute
          depends_on: [cite]
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              verdict: { type: string, enum: [pass, fail] }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    author: { type: string, enum: [plan, spec] }
                    target: { type: string }
                    cause: { type: string }
                    fix: { type: string }
                    design_it_in: { type: boolean }
                  required: [author, target, cause, fix, design_it_in]
            required: [verdict, findings]

        - id: spec
          command: spec
          when: "$LOOP_PREV.round.output.next == 'spec'"
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob, Agent]
          sandbox:
            enabled: true
            network:
              allowedDomains: []
              allowManagedDomainsOnly: true
          agents:
            examiner:
              description: Measures behavior with a script on a throwaway copy of the checkout
              prompt: |
                You are the Examiner. The specifier hands you one measurement (the behavior a
                Spec line's assertion pins) and a scratch directory. Measure it and return
                the result.

                - Copy the checkout's tracked and unignored untracked files (the list from
                  git ls-files -co --exclude-standard) into a fresh directory under the
                  scratch directory, and work only in that copy. Never write to the checkout.
                - Run every command under timeout and nice, with at most half of nproc jobs.
                  You have no network.
                - Write the smallest script that measures the behavior, run it, and keep its
                  output.
                - A measurement you cannot make gets status unresolved, with the reason in
                  value. Never guess a value.

                Return JSON only, in this shape:
                {"question": "...", "value": "...", "script": "...", "output": "...",
                 "status": "measured" or "unresolved"}
              tools: [Read, Grep, Glob, Bash, Write, Edit]
          output_format:
            type: object
            properties:
              lines:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^t[0-9]+$' }
                    step: { type: string }
                    claim: { type: string }
                    mark: { type: string, enum: [RED, GREEN] }
                    preserves: { type: [string, 'null'] }
                    file: { type: string }
                    shared:
                      type: array
                      items: { type: string }
                    setup: { type: string }
                    assertion: { type: string }
                  required: [id, step, claim, mark, preserves, file, shared, setup, assertion]
              helpers:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^h[0-9]+$' }
                    path: { type: string }
                    provides: { type: string }
                  required: [id, path, provides]
              steps:
                type: array
                maxItems: 20
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^w[0-9]+$' }
                    before: { type: string }
                    lines:
                      type: array
                      minItems: 1
                      items: { type: string }
                    paths:
                      type: array
                      items: { type: string }
                    check: { type: string }
                    blocked_by:
                      type: array
                      items: { type: string }
                  required: [id, before, lines, paths, check, blocked_by]
              decisions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, pattern: '^d[0-9]+$' }
                    question: { type: string }
                    recommend: { type: string }
                    alternative: { type: string }
                    cost: { type: string }
                  required: [id, question, recommend, alternative, cost]
            required: [lines, helpers, steps, decisions]

        - id: arbitrate
          command: arbitrate
          depends_on: [spec]
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              verdict: { type: string, enum: [pass, fail] }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    author: { type: string, enum: [plan, spec] }
                    target: { type: string }
                    cause: { type: string }
                    fix: { type: string }
                    design_it_in: { type: boolean }
                  required: [author, target, cause, fix, design_it_in]
            required: [verdict, findings]

        - id: round
          depends_on: [prosecute, arbitrate]
          trigger_rule: all_done
          mutates_checkout: false
          bash: |
            cite=$cite.output
            prosecute=$prosecute.output
            spec=$spec.output
            arbitrate=$arbitrate.output
            prev=$LOOP_PREV.round.output
            [ -n "$cite" ] || cite=null
            [ -n "$prosecute" ] || prosecute=null
            [ -n "$spec" ] || spec=null
            [ -n "$arbitrate" ] || arbitrate=null
            [ -n "$prev" ] || prev=null
            jq -nc --argjson resolved "$cite" --argjson ruling "$prosecute" --argjson written "$spec" --argjson arbiter "$arbitrate" --argjson last "$prev" '
              ($last // {}) as $p
              | ($p.cuts // 0) as $cuts
              | ($p.specs // 0) as $specs
              | if $ruling != null then
                  ($resolved.unresolved | map({
                    author: "plan",
                    target: .step,
                    cause: "\(.path):\(.line): \(.reason)",
                    fix: "cite the line whose text is the quote",
                    design_it_in: false
                  })) as $uncited
                  | {
                      next: (if $ruling.verdict == "pass" and ($uncited | length) == 0 then "spec" else "plan" end),
                      cuts: ($cuts + 1),
                      specs: $specs,
                      plan: $resolved.plan,
                      spec: ($p.spec // null),
                      findings: ($ruling.findings + $uncited + (($p.findings // []) | map(select(.author == "spec"))))
                    }
                else
                  {
                    next: (if $arbiter.verdict == "pass" then "done"
                           elif any($arbiter.findings[]; .author == "plan") then "plan"
                           else "spec" end),
                    cuts: $cuts,
                    specs: ($specs + 1),
                    plan: $p.plan,
                    spec: $written,
                    findings: $arbiter.findings
                  }
                end
              | if (.next == "plan" and .cuts >= 4) or (.next == "spec" and .specs >= 4) then .next = "refused" else . end'
          output_format:
            type: object
            properties:
              next: { type: string, enum: [plan, spec, done, refused] }
              cuts: { type: integer }
              specs: { type: integer }
              plan: { type: object }
              spec: { type: [object, 'null'] }
              findings: { type: array, items: { type: object } }
            required: [next, cuts, specs, plan, spec, findings]

  - id: verdict
    runtime: uv
    depends_on: [recall, rounds]
    trigger_rule: all_done
    mutates_checkout: false
    timeout: 60000
    with:
      recall: $recall.output
      round: { from: $rounds.output, if_skipped: null }
    script: |
      import json
      import os
      import sys


      def surviving(plan: dict, spec: dict, findings: list) -> list:
          targeted = {finding.get("target") for finding in findings}
          seen = set()
          kept = []
          for decision in list(plan.get("decisions") or []) + list(spec.get("decisions") or []):
              if decision["id"] in seen:
                  continue
              seen.add(decision["id"])
              if decision["id"] not in targeted:
                  kept.append(decision)
          return kept


      def main() -> int:
          recall = json.loads(os.environ["INPUTS_RECALL"])
          last = json.loads(os.environ["INPUTS_ROUND"])
          if last is None and recall["next"] == "reuse":
              record = recall["record"]
              result = {
                  "verdict": record["verdict"],
                  "recalled": True,
                  "findings": record["findings"],
                  "decisions": record["decisions"],
                  "approval": record["approval"],
                  "key": recall["key"],
                  "plan": record["plan"],
                  "spec": record["spec"],
              }
          elif last is not None and recall["next"] == "rounds":
              spec = last["spec"] if last["spec"] is not None else {}
              result = {
                  "verdict": "pass" if last["next"] == "done" else "refused",
                  "recalled": False,
                  "findings": last["findings"],
                  "decisions": surviving(last["plan"], spec, last["findings"]),
                  "approval": {"state": "none", "text": ""},
                  "key": recall["key"],
                  "plan": last["plan"],
                  "spec": spec,
              }
          else:
              print(
                  "verdict: recall.next is %r but the last round is %s"
                  % (recall["next"], "missing" if last is None else "present"),
                  file=sys.stderr,
              )
              return 1
          print(json.dumps(result, separators=(",", ":")))
          return 0


      sys.exit(main())
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [pass, refused] }
        plan: { type: object }
        spec: { type: object }
        findings: { type: array, items: { type: object } }
        decisions: { type: array, items: { type: object } }
        recalled: { type: boolean }
        approval:
          type: object
          properties:
            state: { type: string, enum: [approved, rejected, none] }
            text: { type: string }
          required: [state, text]
        key: { type: string }
      required: [verdict, plan, spec, findings, decisions, recalled, approval, key]

  - id: keep
    depends_on: [verdict]
    mutates_checkout: false
    bash: |
      set -euo pipefail
      found=$recall.output
      answer=$verdict.output
      key=$recall.output.key
      carry=$INPUTS_CARRY
      dir="$STATE_DIR/feature-pipeline/plans"
      mkdir -p "$dir"
      jq -n --argjson found "$found" --argjson answer "$answer" --arg run "$WORKFLOW_ID" --arg carry "$carry" '
        {
          key: $found.key,
          design: $found.design,
          design_blob: $found.design_blob,
          scope: $found.scope,
          head: $found.head,
          run: $run,
          carry: ((($found.record // {}).carry // []) + [$carry]),
          verdict: $answer.verdict,
          plan: $answer.plan,
          spec: $answer.spec,
          findings: $answer.findings,
          decisions: $answer.decisions,
          approval: $answer.approval
        }' > "$dir/$key.json.tmp"
      mv "$dir/$key.json.tmp" "$dir/$key.json"
