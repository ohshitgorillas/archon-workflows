name: finish
description: >-
  Finishes an approved design in an existing checkout and lands it. Each cycle merges the
  land branch, plans the code and test steps, builds every unblocked step, runs the full
  gate and checks that committed tests match their spec lines. A blocking decision stops the
  cycle before it builds: the owner is asked it at once, and the next cycle resumes planning
  from where it stopped with the answer. The owner is asked only decisions: the open
  decisions of the Plan and Spec and product questions from design gaps and stuck steps. A
  failure the run cannot fix stops it at once with the reason: a refused plan-review names
  the blocking findings planning could not clear, and a stuck build step names its last
  findings and design gaps. The cycle backstop cancels with what is still open. Lands by
  fast-forward only; nothing pushes. Start with
  --cwd set to the branch's checkout.
provider: claude
model: claude-opus-5-5
effort: medium

worktree:
  enabled: false

inputs:
  design:
    required: true
    description: Approved design path in the checkout.
  scope:
    required: true
    description: Design steps left to build.
  full_check:
    required: true
    description: The repository's full gate command.
  branch:
    required: true
    description: The branch being finished.
  land_branch:
    required: true
    description: The branch it lands on.
  land_checkout:
    required: true
    description: Checkout holding land_branch.

nodes:
  - id: baseline
    bash: |
      cmd="$INPUTS_FULL_CHECK"
      out=$(bash -c "$cmd" 2>&1)
      rc=$?
      tail=$(printf '%s' "$out" | tail -c 4000)
      if [ "$rc" -eq 0 ]; then s=green; else s=red; fi
      jq -n --arg s "$s" --arg t "$tail" '{status: $s, tail: $t}'
    output_format:
      type: object
      properties:
        status: { type: string, enum: [green, red] }
        tail: { type: string }
      required: [status, tail]

  - id: cycle
    depends_on: [baseline]
    loop_group:
      max_iterations: 4
      until_bash: |
        d=$tally.output.done
        s=$tally.output.stop
        [ "$d" = true ] || [ "$s" = true ]
      nodes:
        - id: sync
          bash: |
            git merge --no-edit "$INPUTS_LAND_BRANCH" >&2
            rc=$?
            if [ "$rc" -eq 0 ]; then
              jq -n '{conflicted: false, paths: ""}'
            elif git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              paths=$(git diff --name-only --diff-filter=U)
              jq -n --arg p "$paths" '{conflicted: true, paths: $p}'
            else
              exit $rc
            fi
          output_format:
            type: object
            properties:
              conflicted: { type: boolean }
              paths: { type: string }
            required: [conflicted, paths]

        - id: resolve
          command: resolve
          depends_on: [sync]
          when: "$sync.output.conflicted == true"
          context: fresh
          allowed_tools: [Read, Edit, Grep, Glob]
          output_format:
            type: object
            properties:
              resolved: { type: boolean }
              reason: { type: string }
            required: [resolved, reason]

        - id: merge
          depends_on: [resolve]
          bash: |
            resolved=$resolve.output.resolved
            reason=$resolve.output.reason
            paths=$(git diff --name-only --diff-filter=U)
            merged=false
            if [ "$resolved" = true ]; then
              left=$(printf '%s\n' "$paths" | while IFS= read -r p; do
                [ -f "$p" ] && grep -qE '^(<<<<<<<|\|\|\|\|\|\|\||>>>>>>>)( |$)' -- "$p" && printf '%s\n' "$p"
              done)
              if [ -n "$left" ]; then
                reason="conflict markers are left in: $left"
              else
                printf '%s\n' "$paths" | while IFS= read -r p; do
                  [ -n "$p" ] && git add -A -- "$p"
                done
                if out=$(git commit --no-edit 2>&1); then
                  merged=true
                else
                  reason="the merge commit was refused: $(printf '%s' "$out" | tail -c 3000)"
                fi
                printf '%s\n' "$out" >&2
              fi
            fi
            jq -n --argjson m "$merged" --arg p "$paths" --arg r "$reason" '{merged: $m, paths: $p, reason: $r}'
          output_format:
            type: object
            properties:
              merged: { type: boolean }
              paths: { type: string }
              reason: { type: string }
            required: [merged, paths, reason]

        - id: unmerged
          depends_on: [merge]
          when: "$merge.output.merged != true"
          cancel: "finish stopped: the merge of the land branch could not be committed. Paths: $merge.output.paths Reason: $merge.output.reason"

        - id: planning
          include: plan-review
          depends_on: [sync, merge, unmerged]
          trigger_rule: none_failed_min_one_success
          with:
            design: $INPUTS.design
            design_ref: $INPUTS.land_branch
            land_branch: $INPUTS.land_branch
            land_checkout: $INPUTS.land_checkout
            scope: $INPUTS.scope
            resume: $LOOP_PREV.planning__verdict.output.stopped
            answer: $LOOP_PREV.ask.output.text
            survey: |
              Full-check tail of the previous cycle (empty on the first cycle): $LOOP_PREV.gate.output
              Baseline full-check tail: $baseline.output
            carry: |
              Previous plan-review result (plan, spec, findings, verdict): $LOOP_PREV.planning.output
              Previous build result (remaining, stuck, design gaps, stray edits): $LOOP_PREV.tally.output.build
              Previous pin check: $LOOP_PREV.bail.output

        - id: build
          include: build-loop
          depends_on: [planning]
          when: "$planning.output.verdict == 'pass'"
          with:
            plan: $planning.output.plan
            spec: $planning.output.spec

        - id: gate
          depends_on: [build]
          trigger_rule: all_done
          when: "$planning.output.verdict == 'pass'"
          bash: |
            cmd="$INPUTS_FULL_CHECK"
            out=$(bash -c "$cmd" 2>&1)
            rc=$?
            tail=$(printf '%s' "$out" | tail -c 4000)
            if [ "$rc" -eq 0 ]; then s=green; else s=red; fi
            jq -n --arg s "$s" --arg t "$tail" '{status: $s, tail: $t}'
          output_format:
            type: object
            properties:
              status: { type: string, enum: [green, red] }
              tail: { type: string }
            required: [status, tail]

        - id: bail
          command: bail
          depends_on: [gate]
          when: "$planning.output.verdict == 'pass'"
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob, 'Bash(git log:*)', 'Bash(git diff:*)', 'Bash(git show:*)']
          output_format:
            type: object
            properties:
              pin: { type: string, enum: [ok, broken] }
              findings:
                type: array
                items: { type: string }
              open: { type: integer }
              decisions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    question: { type: string }
                    recommend: { type: string }
                    alternative: { type: string }
                    cost: { type: string }
                  required: [id, question, recommend, alternative, cost]
              question: { type: string }
            required: [pin, findings, open, decisions, question]

        - id: tally
          runtime: uv
          depends_on: [bail]
          trigger_rule: all_done
          mutates_checkout: false
          timeout: 60000
          with:
            verdict: $planning.output.verdict
            blocking: $planning.output.question
            refusal: $planning.output.findings
            gate: { from: $gate.output.status, if_skipped: skipped }
            pin: { from: $bail.output.pin, if_skipped: skipped }
            open: { from: $bail.output.open, if_skipped: 0 }
            decisions: { from: $bail.output.decisions, if_skipped: [] }
            question: { from: $bail.output.question, if_skipped: "" }
            pins: { from: $bail.output.findings, if_skipped: [] }
            tail: { from: $gate.output.tail, if_skipped: "" }
            build: { from: $build.output, if_skipped: null }
            prior: $LOOP_PREV.tally.output.cycle
          script: |
            import json
            import os

            CYCLES = 4

            verdict = os.environ["INPUTS_VERDICT"]
            gate = os.environ["INPUTS_GATE"]
            pin = os.environ["INPUTS_PIN"]
            opened = json.loads(os.environ["INPUTS_OPEN"])
            decisions = json.loads(os.environ["INPUTS_DECISIONS"])
            blocking = os.environ["INPUTS_BLOCKING"]
            refusal = json.loads(os.environ["INPUTS_REFUSAL"])
            question = os.environ["INPUTS_QUESTION"]
            pins = json.loads(os.environ["INPUTS_PINS"])
            tail = os.environ["INPUTS_TAIL"]
            build = json.loads(os.environ["INPUTS_BUILD"])
            prior = os.environ["INPUTS_PRIOR"].strip()
            cycle = (int(prior) if prior else 0) + 1

            # A failure the run cannot fix stops it at once, with the reason.
            reasons = []
            if verdict == "refused":
                blockers = [f for f in refusal if f.get("severity") == "blocking"] or refusal
                reasons.append(
                    "plan-review refused the Plan and Spec; the blocking findings planning could not clear: %s."
                    % json.dumps(blockers)
                )
            if build is not None and build["stuck"]:
                asked = {d["id"] for d in decisions}
                failed = [s for s in build["stuck"] if "stuck-" + s not in asked and "gap-" + s not in asked]
                if failed:
                    reasons.append(
                        "the build cannot finish step %s: another try cannot change the result. "
                        "Last review findings: %s. Design gaps: %s."
                        % (
                            ", ".join(failed),
                            json.dumps(build.get("findings") or []),
                            json.dumps(build["design_gaps"]),
                        )
                    )
            stop = bool(reasons)
            if stop and question:
                reasons.append("Decisions also open: " + question)
            reason = "finish stopped: " + " ".join(reasons) if stop else ""

            done = (
                not stop
                and verdict == "pass"
                and gate == "green"
                and pin == "ok"
                and opened == 0
                and build is not None
                and build["remaining"] == 0
            )

            # What is still open, for the cycle backstop's cancel.
            outstanding = []
            if not done and not stop:
                if verdict == "blocked":
                    outstanding.append("the blocking decisions plan-review asked: " + blocking)
                if opened > 0:
                    outstanding.append("%d owner decisions: %s" % (opened, question))
                if build is not None and build["remaining"] > 0:
                    outstanding.append("%d buildable steps not yet built" % build["remaining"])
                if gate != "green" and gate != "skipped":
                    outstanding.append("the full gate is red; its tail: " + tail)
                if pin == "broken":
                    outstanding.append("the pin check is broken: " + json.dumps(pins))

            # The owner is asked decisions only, and not once the cycle cap is reached.
            text = "\n\n".join(part for part in [blocking, question] if part)
            ask = bool(text) and not stop and not done and cycle < CYCLES
            print(
                json.dumps(
                    {
                        "done": done,
                        "stop": stop,
                        "reason": reason,
                        "build": build,
                        "cycle": cycle,
                        "ask": ask,
                        "question": text,
                        "open": "; ".join(outstanding) or "nothing named",
                    },
                    separators=(",", ":"),
                )
            )
          output_format:
            type: object
            properties:
              done: { type: boolean }
              stop: { type: boolean }
              reason: { type: string }
              build: { type: [object, "null"] }
              cycle: { type: integer }
              ask: { type: boolean }
              question: { type: string }
              open: { type: string }
            required: [done, stop, reason, build, cycle, ask, question, open]

        - id: ask
          depends_on: [tally]
          when: "$tally.output.ask == true"
          wait:
            attention: $tally.output.question

  - id: cycled
    depends_on: [cycle]
    mutates_checkout: false
    bash: |
      result=$cycle.output
      printf '%s' "$result"
    output_format:
      type: object

  - id: halt
    depends_on: [cycled]
    when: "$cycled.output.stop == 'true'"
    cancel: "$cycled.output.reason"

  - id: limit
    depends_on: [cycled]
    when: "$cycled.output.done != 'true' && $cycled.output.stop != 'true'"
    cancel: "finish stopped at its cap of 4 cycles without landing. Still open: $cycled.output.open"

  - id: land
    depends_on: [cycled, halt, limit]
    trigger_rule: none_failed_min_one_success
    bash: git -C "$INPUTS_LAND_CHECKOUT" merge --ff-only "$INPUTS_BRANCH"
