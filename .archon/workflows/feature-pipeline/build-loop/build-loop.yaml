name: build-loop
description: >-
  Building block, include only; not for a standalone run. Builds one step per iteration,
  test steps and code steps alike, in the build order of the Plan and Spec: a writer, the
  step's own section check, a commit of the step's paths, then a review. Fixes go by cause,
  at most 2 per step; past that the step is stuck and leaves the loop. Returns the last
  review.
provider: claude
model: claude-opus-5-5
effort: medium

inputs:
  plan:
    required: true
    description: Plan from plan-review.
  spec:
    required: true
    description: Spec from plan-review.

returns: result

nodes:
  - id: before
    mutates_checkout: false
    bash: git status --porcelain

  - id: steps
    depends_on: [before]
    loop_group:
      max_iterations: 120
      until_bash: |
        r=$review.output.remaining
        [ "$r" = 0 ]
      nodes:
        - id: write
          command: write
          model: claude-sonnet-5-5
          effort: medium
          context: fresh
          allowed_tools: [Read, Grep, Glob, Edit, Write]
          output_format:
            type: object
            properties:
              step_id: { type: string }
              paths:
                type: array
                items: { type: string }
              check: { type: string }
              design_gap: { type: [string, 'null'] }
            required: [step_id, paths, check, design_gap]

        - id: check
          depends_on: [write]
          bash: |
            cmd=$write.output.check
            out=$(bash -c "$cmd" 2>&1)
            rc=$?
            tail=$(printf '%s' "$out" | tail -c 4000)
            if [ "$rc" -eq 0 ]; then s=green; else s=red; fi
            jq -n --arg s "$s" --arg t "$tail" '{status: $s, tail: $t}'
          output_format:
            type: object
            properties:
              status: { type: string, enum: [green, red] }
              tail: { type: string }
            required: [status, tail]

        - id: commit
          depends_on: [check]
          trigger_rule: all_done
          bash: |
            s=$check.output.status
            id=$write.output.step_id
            paths=$write.output.paths
            committed=false
            if [ "$s" = green ]; then
              mapfile -t arr < <(printf "%s" "$paths" | jq -r ".[]")
              git add -- "${arr[@]}"
              if git commit -q -m "$id" -- "${arr[@]}"; then committed=true; fi
            fi
            tree=$(git status --porcelain)
            jq -n --argjson c "$committed" --arg t "$tree" '{committed: $c, status: $t}'
          output_format:
            type: object
            properties:
              committed: { type: boolean }
              status: { type: string }
            required: [committed, status]

        - id: review
          command: review
          depends_on: [commit]
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              verdict: { type: string, enum: [pass, fix, stuck] }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    cause: { type: string }
                    fix: { type: string }
                  required: [cause, fix]
              fixes_used: { type: integer }
              next: { type: [string, 'null'] }
              remaining: { type: integer }
              done:
                type: array
                items: { type: string }
              stuck:
                type: array
                items: { type: string }
              design_gaps:
                type: array
                items: { type: string }
              stray:
                type: array
                items: { type: string }
            required: [verdict, findings, fixes_used, next, remaining, done, stuck, design_gaps, stray]

  - id: result
    depends_on: [steps]
    mutates_checkout: false
    bash: |
      last=$steps.output
      printf '%s' "$last"
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [pass, fix, stuck] }
        findings:
          type: array
          items: { type: object }
        fixes_used: { type: integer }
        next: { type: [string, 'null'] }
        remaining: { type: integer }
        done:
          type: array
          items: { type: string }
        stuck:
          type: array
          items: { type: string }
        design_gaps:
          type: array
          items: { type: string }
        stray:
          type: array
          items: { type: string }
      required: [verdict, remaining, done, stuck, design_gaps, stray]
