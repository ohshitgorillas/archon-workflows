name: finish-gate
description: >-
  Support block. Runs the one gate invocation and always exits 0, printing gate.sh's own
  exit=<rc> log=<path> line so a red gate feeds the next node. Empty files runs the full gate.
provider: claude
model: claude-sonnet-5-5

inputs:
  files:
    default: ""
    description: Space-separated test files; empty runs the full gate.

nodes:
  - id: run
    bash: |
      if [ -n "$INPUTS_FILES" ]; then gate="$HQP_GATE_SECTION $INPUTS_FILES"; else gate="$HQP_GATE_FULL"; fi
      CLAUDE_SCRATCH="$ARTIFACTS_DIR" PYTHONPATH="$PWD" scripts/gate.sh $gate || true
